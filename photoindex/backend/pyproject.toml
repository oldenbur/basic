[project]
name = "photoindex"
version = "0.1.0"
description = "Index, tag and browse a Dropbox photo library"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "dropbox>=12.0",
    "boto3>=1.35",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "exifread>=3.0",
    "imagehash>=4.3",
]

[project.scripts]
photoindex = "photoindex.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
