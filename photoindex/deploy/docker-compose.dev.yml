# Laptop stack. Infra only by default:
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Everything in containers (API, worker, UI) too:
#   docker compose -f deploy/docker-compose.dev.yml --profile app up -d
name: photoindex

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: photoindex
      POSTGRES_PASSWORD: photoindex
      POSTGRES_DB: photoindex
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoindex"]
      interval: 2s
      retries: 30

  # S3-compatible stand-in for Cloudflare R2 (MinIO no longer publishes public images).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -dir=/data -master.volumeSizeLimitMB=1024
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  api:
    profiles: [app]
    build: ../backend
    command: ["photoindex", "serve", "--host", "0.0.0.0"]
    env_file: [../backend/.env]
    environment: &container_env
      DATABASE_URL: postgresql+psycopg://photoindex:photoindex@db:5432/photoindex
      S3_ENDPOINT_URL: http://s3:8333
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}

  worker:
    profiles: [app]
    build: ../backend
    command: ["photoindex", "run", "--loop", "900"]
    env_file: [../backend/.env]
    environment: *container_env
    depends_on: {db: {condition: service_healthy}}

  web:
    profiles: [app]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_TARGET: http://api:8000
    volumes: [../frontend:/app, webmodules:/app/node_modules]
    ports: ["5173:5173"]

volumes:
  pgdata:
  s3data:
  webmodules:
