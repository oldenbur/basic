services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: es-sandbox
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=es-sandbox
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    # Ephemeral storage: data lives in memory and is discarded when the container stops.
    tmpfs:
      - /usr/share/elasticsearch/data:uid=1000,gid=0
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
